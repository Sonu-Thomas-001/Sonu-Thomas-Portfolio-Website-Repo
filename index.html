    <style>
      :root {
        --bg-page: #F5F0EB;
        --bg-surface: #FEFCF9;
        --color-primary: #4F46E5;
        --color-secondary: #7C3AED;
        --color-copper: #C47D5A;
        --border-color: #E8E0D8;
        --ink-primary: #1A1614;
        --ink-secondary: #4A4340;
      }

      html {
        background-color: #F5F0EB;
        color: #1A1614;
        scroll-behavior: smooth;
      }

      body {
        background-color: #F5F0EB;
        color: #4A4340;
        font-feature-settings: "cv02", "cv03", "cv04", "cv11";
      }

      /* Editorial Scrollbar */
      ::-webkit-scrollbar {
        width: 7px;
      }
      ::-webkit-scrollbar-track {
        background: #F5F0EB;
      }
      ::-webkit-scrollbar-thumb {
        background: #D8CEC4;
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #C47D5A;
      }

      /* Gradient text utilities */
      .gradient-text {
        background: linear-gradient(135deg, #4F46E5 0%, #7C3AED 50%, #C47D5A 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .gradient-copper {
        background: linear-gradient(135deg, #C47D5A 0%, #DF9B7A 50%, #B06846 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      /* Warm Editorial Glass Card */
      .editorial-card {
        background: rgba(254, 252, 249, 0.92);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(232, 224, 216, 0.85);
        transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .editorial-card:hover {
        border-color: rgba(196, 125, 90, 0.4);
        box-shadow: 0 20px 40px -10px rgba(26, 22, 20, 0.08);
      }

      /* Minimal Section Divider */
      .editorial-divider {
        height: 1px;
        background: linear-gradient(to right, transparent, #E8E0D8 20%, #E8E0D8 80%, transparent);
      }

      /* Subtle Film Grain SVG */
      .grain-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        pointer-events: none;
        z-index: 999;
        opacity: 0.028;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      }

      /* Clip-path reveal utilities */
      .reveal-container {
        overflow: hidden;
      }
    </style>
