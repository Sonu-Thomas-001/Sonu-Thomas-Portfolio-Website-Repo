<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>

    <meta name="author" content="Sonu Thomas" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />

    <meta property="og:title" content="Sonu Thomas | AI Software Engineer" />

    <meta property="og:site_name" content="Sonu Thomas Portfolio" />

    <!-- Google Fonts: Inter, Space Grotesk, JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Sonu Thomas",
      "url": "https://www.sonuthomas.me/",
      "jobTitle": "AI Software Engineer",
      "worksFor": {
        "@type": "Organization",
        "name": "HCLTech"
      },
      "alumniOf": {
        "@type": "CollegeOrUniversity",
        "name": "IIT Guwahati"
      },
      "sameAs": [
        "https://www.linkedin.com/in/sonuthomas001",
        "https://github.com/Sonu-Thomas-001"
      ]
    }
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              display: ['"Space Grotesk"', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'monospace'],
            },
            colors: {
              primary: {
                DEFAULT: '#4F46E5',
                50: '#EEF2FF',
                100: '#E0E7FF',
                200: '#C7D2FE',
                500: '#6366F1',
                600: '#4F46E5',
                700: '#4338CA',
              },
              secondary: {
                DEFAULT: '#7C3AED',
                50: '#F5F3FF',
                500: '#8B5CF6',
                600: '#7C3AED',
              },
              accent: '#0EA5E9',
              page: '#FAFBFD',
              surface: '#FFFFFF',
              surfaceAlt: '#F8FAFC',
              dark: '#FAFBFD',
              slate: {
                50: '#F8FAFC',
                100: '#F1F5F9',
                200: '#E2E8F0',
                300: '#CBD5E1',
                400: '#94A3B8',
                500: '#64748B',
                600: '#475569',
                700: '#334155',
                800: '#1E293B',
                900: '#0F172A',
                950: '#020617',
              },
              cleanWhite: '#FFFFFF',
              cleanDark: '#0F172A',
            },
            boxShadow: {
              'soft-sm': '0 1px 3px rgba(15, 23, 42, 0.04), 0 1px 2px rgba(15, 23, 42, 0.02)',
              'soft-md': '0 4px 20px -2px rgba(15, 23, 42, 0.06), 0 2px 6px -1px rgba(15, 23, 42, 0.03)',
              'soft-lg': '0 12px 32px -4px rgba(15, 23, 42, 0.08), 0 4px 12px -2px rgba(15, 23, 42, 0.04)',
              'glow-primary': '0 0 25px -5px rgba(99, 102, 241, 0.25)',
            },
            animation: {
              'blob': 'blob 10s infinite',
              'pulse-subtle': 'pulseSubtle 3s ease-in-out infinite',
              'shimmer': 'shimmer 2.5s infinite',
            },
            keyframes: {
              blob: {
                '0%': { transform: 'translate(0px, 0px) scale(1)' },
                '33%': { transform: 'translate(25px, -35px) scale(1.08)' },
                '66%': { transform: 'translate(-20px, 20px) scale(0.94)' },
                '100%': { transform: 'translate(0px, 0px) scale(1)' },
              },
              pulseSubtle: {
                '0%, 100%': { opacity: 1, transform: 'scale(1)' },
                '50%': { opacity: 0.85, transform: 'scale(1.02)' },
              },
              shimmer: {
                '100%': { transform: 'translateX(100%)' }
              }
            }
          },
        },
      }
    </script>
    <style>
      :root {
        --bg-page: #FAFBFD;
        --bg-surface: #FFFFFF;
        --color-primary: #4F46E5;
        --color-secondary: #7C3AED;
        --border-color: #E2E8F0;
      }

      html {
        background-color: #FAFBFD;
        color: #0F172A;
      }

      body {
        background-color: #FAFBFD;
        color: #334155;
      }

      /* Custom Light Theme Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #F1F5F9;
      }
      ::-webkit-scrollbar-thumb {
        background: #CBD5E1;
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94A3B8;
      }

      /* Gradient text utility */
      .gradient-text {
        background: linear-gradient(135deg, #4F46E5 0%, #7C3AED 50%, #0EA5E9 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      /* Subtle grid background for modern AI tech feel */
      .bg-ai-grid {
        background-size: 32px 32px;
        background-image: 
          linear-gradient(to right, rgba(148, 163, 184, 0.08) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(148, 163, 184, 0.08) 1px, transparent 1px);
      }

      /* Dot grid */
      .bg-ai-dots {
        background-image: radial-gradient(rgba(99, 102, 241, 0.12) 1px, transparent 1px);
        background-size: 24px 24px;
      }

      /* Glass card utility */
      .glass-card {
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(226, 232, 240, 0.8);
      }
    </style>
  </head>
  <body class="bg-page text-slate-700 antialiased selection:bg-primary/20 selection:text-primary font-sans overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
