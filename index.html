<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Primary Meta Tags -->
    <title>Sonu Thomas — AI Software Engineer & Intelligent Systems</title>
    <meta name="title" content="Sonu Thomas — AI Software Engineer & Intelligent Systems" />
    <meta name="description" content="Personal portfolio of Sonu Thomas, an AI Software Engineer crafting intelligent systems, LLM solutions, and full-stack software with editorial precision." />
    <meta name="keywords" content="Sonu Thomas, AI Software Engineer, Machine Learning, Full Stack Developer, Kerala, AI Engineer Kannur, Intelligent Systems, Clash Display" />
    <meta name="author" content="Sonu Thomas" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#FAFBFD" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.sonuthomas.me/" />
    <meta property="og:title" content="Sonu Thomas — AI Software Engineer" />
    <meta property="og:description" content="Personal portfolio of Sonu Thomas, an AI Software Engineer crafting intelligent systems, LLM solutions, and full-stack software." />
    <meta property="og:image" content="https://cdn.jsdelivr.net/gh/Sonu-Thomas-001/image-host@master/Sonu-Thomas-Portfolio-Website-Repo/ProfilePic.jpg" />
    <meta property="og:site_name" content="Sonu Thomas Portfolio" />

    <!-- Fonts: Clash Display + Satoshi (FontShare CDN) & JetBrains Mono (Google Fonts) -->
    <link rel="preconnect" href="https://api.fontshare.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&f[]=satoshi@300,400,500,700,900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Sonu Thomas",
      "url": "https://www.sonuthomas.me/",
      "jobTitle": "AI Software Engineer",
      "worksFor": {
        "@type": "Organization",
        "name": "HCLTech"
      },
      "alumniOf": {
        "@type": "CollegeOrUniversity",
        "name": "IIT Guwahati"
      },
      "sameAs": [
        "https://www.linkedin.com/in/sonuthomas001",
        "https://github.com/Sonu-Thomas-001"
      ]
    }
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Satoshi', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
              display: ['"Clash Display"', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'monospace'],
            },
            colors: {
              primary: {
                DEFAULT: '#4F46E5',
                50: '#EEF2FF',
                100: '#E0E7FF',
                200: '#C7D2FE',
                500: '#6366F1',
                600: '#4F46E5',
                700: '#4338CA',
              },
              secondary: {
                DEFAULT: '#7C3AED',
                50: '#F5F3FF',
                500: '#8B5CF6',
                600: '#7C3AED',
              },
              accent: '#06B6D4',
              page: '#FAFBFD',
              surface: '#FFFFFF',
              surfaceAlt: '#F8FAFC',
              slate: {
                50: '#F8FAFC',
                100: '#F1F5F9',
                200: '#E2E8F0',
                300: '#CBD5E1',
                400: '#94A3B8',
                500: '#64748B',
                600: '#475569',
                700: '#334155',
                800: '#1E293B',
                900: '#0F172A',
                950: '#020617',
              },
            },
            boxShadow: {
              'soft-sm': '0 1px 3px rgba(15, 23, 42, 0.04), 0 1px 2px rgba(15, 23, 42, 0.02)',
              'soft-md': '0 4px 20px -2px rgba(15, 23, 42, 0.05), 0 2px 6px -1px rgba(15, 23, 42, 0.02)',
              'soft-lg': '0 16px 36px -6px rgba(15, 23, 42, 0.07), 0 6px 14px -2px rgba(15, 23, 42, 0.03)',
              'glow-primary': '0 0 30px -5px rgba(79, 70, 229, 0.2)',
            },
            letterSpacing: {
              tighter: '-0.04em',
              tight: '-0.02em',
              normal: '0em',
              wide: '0.04em',
              wider: '0.08em',
              widest: '0.14em',
            },
          },
        },
      }
    </script>
    <style>
      :root {
        --bg-page: #FAFBFD;
        --bg-surface: #FFFFFF;
        --color-primary: #4F46E5;
        --color-secondary: #7C3AED;
        --border-color: #E2E8F0;
      }

      html {
        background-color: #FAFBFD;
        color: #0F172A;
        scroll-behavior: smooth;
      }

      body {
        background-color: #FAFBFD;
        color: #334155;
        font-feature-settings: "cv02", "cv03", "cv04", "cv11";
      }

      /* Editorial Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #FAFBFD;
      }
      ::-webkit-scrollbar-thumb {
        background: #CBD5E1;
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94A3B8;
      }

      /* Gradient text utility */
      .gradient-text {
        background: linear-gradient(135deg, #4F46E5 0%, #7C3AED 55%, #06B6D4 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      /* Editorial Glass Card */
      .editorial-card {
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(226, 232, 240, 0.9);
        transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .editorial-card:hover {
        border-color: rgba(79, 70, 229, 0.3);
        box-shadow: 0 16px 36px -6px rgba(15, 23, 42, 0.07);
      }

      /* Minimal Section Divider */
      .editorial-divider {
        height: 1px;
        background: linear-gradient(to right, transparent, #E2E8F0 20%, #E2E8F0 80%, transparent);
      }

      /* Clip-path reveal utilities */
      .reveal-container {
        overflow: hidden;
      }
    </style>
  </head>
  <body class="bg-page text-slate-700 antialiased selection:bg-primary/15 selection:text-primary font-sans overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
